# Token pricing overlay — USD per MILLION tokens.
#
# Harness ships built-in rates for the Anthropic models it knows. Anything not
# matched here or there is reported as `unpriced_tokens` on the KPI page rather
# than guessed, so a missing rate shows up as a visible gap instead of a wrong
# cost. Add the models your team actually runs.
#
# Keys are matched as a PREFIX of the model id, longest match wins — so
# `gpt-5.5` covers `gpt-5.5-2026-04-01`, and a more specific key overrides it.
#
# Cache pricing is derived from the input rate: reads bill 0.1x (less for the
# few models Harness has a specific rate for), cache writes 1.25x (5-minute TTL)
# or 2x (1-hour TTL).
#
# Note: a Copilot subscription also bills in premium requests rather than tokens.
# Those are not derivable from token counts — record them out-of-band.
#
# To add a rate, uncomment a line below (keep its two-space indent) or add one.

models:
  # gpt-5.5:        {input: 1.25, output: 10.0}
  # gpt-5.4-mini:   {input: 0.25, output: 2.0}
  # claude-opus-5:  {input: 5.0,  output: 25.0}
